<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="section" id="venue-selector">
      </div>
      <div class="section">
        <label>Select Times:</label>
        <div class="time-picker" id="timePicker"></div>
      </div>
      <div class="section">
        <button class="check-btn">Check Availability</button>
      </div>
    </aside>
    <main class="main-content">
      <div id="results"></div>
    </main>
  </div>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 0;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 380px;
      background: #fff;
      box-shadow: 2px 0 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .main-content {
      flex: 1;
      padding: 32px;
    }
    .section {
      margin-bottom: 2px;
    }
    .section label {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    .check-btn {
      background: #007BFF;
      border: none;
      color: white;
      font-size: 1.1em;
      padding: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      width: 200px;
      display: block;
      margin: 0 auto;
      transition: background 0.3s;
    }
    .check-btn:hover {
      background: #0056b3;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 24px;
      margin-top: 30px;
    }

    .result-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 24px;
      min-height: 180px;
      aspect-ratio: 1 / 1; /* Makes the card square */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .result-card h3 {
      margin-bottom: 10px;
      font-size: 1.1em;
      color: #007BFF;
    }
    .result-card ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .result-card li {
      padding: 4px 0;
      font-size: 1em;
    }
    /* Skeleton styles remain unchanged */
    .skeleton-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; min-height: 180px; display: flex; flex-direction: column; justify-content: flex-start; }
    .skeleton-header { height: 24px; width: 60%; margin-bottom: 12px; }
    .skeleton-slot { height: 18px; width: 80%; margin-bottom: 6px; }
    .skeleton { background: linear-gradient(90deg, #f4f6f9 25%, #e0e3e8 50%, #f4f6f9 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; border-radius: 6px; min-height: 22px; margin-bottom: 8px; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    .time-picker {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      border: 1px solid #ccc;
      user-select: none;
      width: 100%;
      max-width: 100%;
    }
    .day-header {
      background: #f4f4f4;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
      padding: 5px;
    }
    .time-label {
      border-bottom: 1px solid #eee;
      border-right: 1px solid #ccc;
      padding: 0 5px;           /* Only horizontal padding */
      text-align: right;
      font-size: 12px;
      height: 20px;             /* Match .time-cell height */
      display: flex;
      align-items: flex-start;  /* Align text to top */
    }
    .time-cell {
      border: 1px solid #eee;
      height: 20px;             /* Match .time-label height */
      cursor: pointer;
    }
    .time-cell.selected {
      background: #4caf50;
    }
    .time-cell:hover {
      background: #e0f7e9;
    }

    .selectable-btn,
    .day-header,
    .time-label {
      background: #f4f4f4;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hover effect */
    .selectable-btn:hover,
    .day-header:hover,
    .time-label:hover {
      background: #e0e3e8;
    }

    /* Active (pressed) effect */
    .selectable-btn:active,
    .day-header:active,
    .time-label:active {
      background: #d1d5db;
      box-shadow: 0 1px 2px rgba(0,0,0,0.10);
      transform: translateY(1px);
    }

    /* Make selectAllCell visually consistent */
    #selectAllCell {
      min-height: 20px;
      min-width: 80px;
      font-weight: bold;
      font-size: 13px;
    }

    /* Make day headers and time labels visually consistent */
    .day-header {
      min-height: 20px;
      font-weight: bold;
      font-size: 13px;
    }

    .time-label {
      min-height: 20px;
      font-size: 12px;
      font-weight: bold;
      justify-content: flex-end;
      padding-right: 8px;
    }
  </style>

  <script>
    document.querySelector('.check-btn').addEventListener('click', async () => {
      let resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      // Get selected venue
      const venue = document.querySelector('input[name="venue"]:checked')?.value;

      // Get selected slots
      const slots = getSelectedSlots();

      // Show loader (optional)
      const skeletonGrid = document.createElement('div');
      skeletonGrid.className = 'results-grid';
      for (let i = 0; i < 7; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        const skeletonHeader = document.createElement('div');
        skeletonHeader.className = 'skeleton skeleton-header';
        card.appendChild(skeletonHeader);
        for (let j = 0; j < 4; j++) {
          const skeletonSlot = document.createElement('div');
          skeletonSlot.className = 'skeleton skeleton-slot';
          card.appendChild(skeletonSlot);
        }
        skeletonGrid.appendChild(card);
      }
      resultsDiv.appendChild(skeletonGrid);

      // Send POST request
      const response = await fetch('/availability', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ venue, slots })
      });
      const data = await response.json();
      if (!response.ok) {
        const errorData = await response.json();
        alert(errorData.error);
      }

      // Remove loader
      resultsDiv.innerHTML = '';

      // Render results (same as before)
      const resultsGrid = document.createElement('div');
      resultsGrid.className = 'results-grid';
      data.forEach(day => {
        const card = document.createElement('div');
        card.className = 'result-card';
        const dayHeader = document.createElement('h3');
        dayHeader.textContent = `${day.day_of_week} (${day.date})`;
        card.appendChild(dayHeader);
        const slotList = document.createElement('ul');
        day.slots.forEach(slot => {
          const slotItem = document.createElement('li');
          slotItem.textContent = `${slot.time} — ${slot.courts_available} courts available`;
          slotList.appendChild(slotItem);
        });
        card.appendChild(slotList);
        resultsGrid.appendChild(card);
      });
      resultsDiv.appendChild(resultsGrid);
    });


    const timePicker = document.getElementById('timePicker');
    const days = 7;
    const hours = 23;

    // Build grid rows
    const selectAllCell = document.createElement('div');
    selectAllCell.id = 'selectAllCell';
    selectAllCell.style.cursor = 'pointer';
    selectAllCell.style.display = 'flex';
    selectAllCell.style.alignItems = 'center';
    selectAllCell.style.justifyContent = 'center';
    selectAllCell.classList.add('selectable-btn');
    timePicker.appendChild(selectAllCell);

    for (let d = 0; d < days; d++) {
      const header = document.createElement('div');
      header.className = 'day-header col-select';
      header.textContent = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d];
      timePicker.appendChild(header);
    }


    // Build grid rows
    for (let h = 6; h < hours; h++) {
      // Add time label
      const label = document.createElement('div');
      label.className = 'time-label row-select';
      label.textContent = `${String(h).padStart(2, '0')}:00`;
      timePicker.appendChild(label);


      // Add time cells for each day
      for (let d = 0; d < days; d++) {
      const cell = document.createElement('div');
      cell.className = 'time-cell';
      cell.dataset.day = d;
      cell.dataset.hour = h;
      timePicker.appendChild(cell);
    }
    }

    document.querySelectorAll('.day-header').forEach((header, d) => {
      header.classList.add('col-select');
    });


    let isMouseDown = false;
    let selectMode = null; // true = selecting, false = deselecting


    timePicker.addEventListener('mousedown', e => {
    if (e.target.classList.contains('time-cell')) {
    isMouseDown = true;
    selectMode = !e.target.classList.contains('selected');
    e.target.classList.toggle('selected', selectMode);
    e.preventDefault();
    }
    });


    timePicker.addEventListener('mouseover', e => {
    if (isMouseDown && e.target.classList.contains('time-cell')) {
    e.target.classList.toggle('selected', selectMode);
    }
    });


    document.addEventListener('mouseup', () => {
    isMouseDown = false;
    });

    // Select/deselect whole row when clicking the time label
    document.querySelectorAll('.row-select').forEach((label, h) => {
      label.addEventListener('click', () => {
        let allSelected = true;
        for (let d = 0; d < days; d++) {
          const cell = timePicker.querySelector(`.time-cell[data-day="${d}"][data-hour="${h + 6}"]`);
          if (cell && !cell.classList.contains('selected')) {
            allSelected = false;
          }
        }
        for (let d = 0; d < days; d++) {
          const cell = timePicker.querySelector(`.time-cell[data-day="${d}"][data-hour="${h + 6}"]`);
          if (cell) cell.classList.toggle('selected', !allSelected);
        }
      });
    });

    // Select/deselect whole column when clicking the day header
    document.querySelectorAll('.col-select').forEach((header, d) => {
      header.addEventListener('click', () => {
        let allSelected = true;
        for (let h = 6; h < hours; h++) {
          const cell = timePicker.querySelector(`.time-cell[data-day="${d}"][data-hour="${h}"]`);
          if (cell && !cell.classList.contains('selected')) {
            allSelected = false;
          }
        }
        for (let h = 6; h < hours; h++) {
          const cell = timePicker.querySelector(`.time-cell[data-day="${d}"][data-hour="${h}"]`);
          if (cell) cell.classList.toggle('selected', !allSelected);
        }
      });
    });

    let selectAllMode = true; // true = select all, false = clear all

    document.getElementById('selectAllCell').addEventListener('click', () => {
      const allCells = timePicker.querySelectorAll('.time-cell');
      allCells.forEach(cell => {
        cell.classList.toggle('selected', selectAllMode);
      });
      // Toggle mode and button text
      selectAllMode = !selectAllMode;
      selectAllCell.textContent = selectAllMode ? 'Select All' : 'Clear All';
    });

    // Set initial text
    selectAllCell.textContent = 'Select All';

    function getSelectedSlots() {
      const selectedCells = document.querySelectorAll('.time-cell.selected');
      const slots = [];
      selectedCells.forEach(cell => {
        slots.push({
          day: parseInt(cell.dataset.day, 10),
          hour: parseInt(cell.dataset.hour, 10)
        });
      });
      return slots;
    }
    async function loadVenues() {
      const response = await fetch('/venues');
      const venues = await response.json();
      const venueSection = document.getElementById('venue-selector');
      venueSection.innerHTML = '<label>Select Venue:</label>';
      venues.forEach(v => {
        const div = document.createElement('div');
        div.innerHTML = `<input type="radio" name="venue" value="${v.id}"> <span>${v.name}</span>`;
        venueSection.appendChild(div);
      });
    }
    loadVenues();
  </script>
</body>
