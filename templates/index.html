<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Court Availability</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header class="title-bar">
    <h1>Tennis Court Checker for SW London</h1>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="section" id="venue-selector">
      </div>
      <div class="section">
        <label>Select Times:</label>
        <div class="time-picker" id="timePicker"></div>
      </div>
      <div class="section">
        <button class="check-btn">Check Availability</button>
      </div>
    </aside>
    <main class="main-content">
      <div id="results"></div>
    </main>
  </div>

  <script src="{{ url_for('static', path='/script.js') }}"></script>
</body>
</html>
