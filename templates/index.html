<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtCheck</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }
    .sidebar {
      width: 300px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
    }
    .sidebar h2 {
      font-size: 1.2em;
      margin-bottom: 15px;
    }
    .section {
      margin-bottom: 20px;
    }
    .section label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9em;
    }
    .section input[type="checkbox"] {
      margin-right: 8px;
    }
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .check-btn {
      background: #007BFF;
      border: none;
      color: white;
      font-size: 1.2em;
      padding: 15px 40px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .check-btn:hover {
      background: #0056b3;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin: 30px auto;
      max-width: 1100px;
      padding: 0 24px;
    }
    .result-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .result-card h3 {
      margin-bottom: 10px;
      font-size: 1.1em;
      color: #007BFF;
    }
    .result-card ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .result-card li {
      padding: 4px 0;
      font-size: 1em;
    }
    /* Skeleton for grid */
    .skeleton-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .skeleton-header {
      height: 24px;
      width: 60%;
      margin-bottom: 12px;
    }
    .skeleton-slot {
      height: 18px;
      width: 80%;
      margin-bottom: 6px;
    }
    .skeleton {
      background: linear-gradient(90deg, #f4f6f9 25%, #e0e3e8 50%, #f4f6f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
      border-radius: 6px;
      min-height: 22px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Settings</h2>
    <div class="section">
      <label>Venues:</label>
      <div><input type="radio" name="venue" id="venue1" value="Clapham Common"> <span>Clapham Common</span></div>
    </div>
    <div class="section">
      <label>Times:</label>
      <div><input type="checkbox" id="morning"> <span>Morning (6am - 12pm)</span></div>
      <div><input type="checkbox" id="afternoon"> <span>Afternoon (12pm - 6pm)</span></div>
      <div><input type="checkbox" id="evening"> <span>Evening (6pm - 10pm)</span></div>
    </div>
    <div class="main">
      <button class="check-btn">Check Availability</button>
    </div>
  </div>

  <script>
    document.querySelector('.check-btn').addEventListener('click', async () => {
        // Remove previous results if any
        let resultsDiv = document.getElementById('results');
        if (resultsDiv) {
          resultsDiv.remove();
        }

        // Create skeleton grid loader
        resultsDiv = document.createElement('div');
        resultsDiv.id = 'results';
        resultsDiv.className = 'results-grid';

        // Add skeleton cards (simulate 7 days)
        for (let i = 0; i < 7; i++) {
          const card = document.createElement('div');
          card.className = 'skeleton-card';

          const skeletonHeader = document.createElement('div');
          skeletonHeader.className = 'skeleton skeleton-header';
          card.appendChild(skeletonHeader);

          for (let j = 0; j < 4; j++) {
            const skeletonSlot = document.createElement('div');
            skeletonSlot.className = 'skeleton skeleton-slot';
            card.appendChild(skeletonSlot);
          }

          resultsDiv.appendChild(card);
        }
        document.body.appendChild(resultsDiv);

        // Fetch data
        const response = await fetch('/availability');
        const data = await response.json();

        // Remove skeleton
        resultsDiv.remove();

        // Create results grid
        resultsDiv = document.createElement('div');
        resultsDiv.id = 'results';
        resultsDiv.className = 'results-grid';

        // Build grid of cards for results
        data.forEach(day => {
          const card = document.createElement('div');
          card.className = 'result-card';

          const dayHeader = document.createElement('h3');
          dayHeader.textContent = `${day.day_of_week} (${day.date})`;
          card.appendChild(dayHeader);

          const slotList = document.createElement('ul');
          day.slots.forEach(slot => {
            const slotItem = document.createElement('li');
            slotItem.textContent = `${slot.time} — ${slot.courts_available} courts available`;
            slotList.appendChild(slotItem);
          });

          card.appendChild(slotList);
          resultsDiv.appendChild(card);
        });

        document.body.appendChild(resultsDiv);
    });
  </script>
</body>
</html>
